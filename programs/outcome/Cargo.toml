[package]
name = "outcome"
version = "0.1.0"
description = "Outcome-first deterministic runtime"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "outcome"

[features]
default = []
# Unicorn-G (VDF + on-chain Groth16/alt_bn128 verify) is heavy (~500 KB) and opt-in
# (trusted-setup pending). Off by default so the canonical binary stays light + deployable.
unicorn-g = ["dep:solana-bn254"]
# VRE Gaming build: only the gaming surface (artifact commit path, config/admin,
# slot spins, expire refund). Cuts rng_v1 resolves, fmt-7 rng_v2 draws, two-phase
# seal/attest, conditions, sortition from the dispatcher (modules stay compiled;
# unused handlers are DCE'd). Build: cargo build-sbf --arch v3 -- --features gaming
gaming = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
solana-bn254 = { version = "2.2", optional = true }
solana-sha256-hasher = "2.3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
